name: ai-operations-platform

services:
  api:
    build:
      context: ./apps/api
    environment:
      API_ADDRESS: :8080
      DATABASE_URL: postgres://ai_operations:local-development-only@postgres:5432/ai_operations?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports: ["8080:8080"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_operations
      POSTGRES_USER: ai_operations
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_operations -d ai_operations"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]

volumes:
  postgres-data:
