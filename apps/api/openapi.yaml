openapi: 3.1.0
info:
  title: AI Operations Platform API
  version: 0.1.0
  description: Organization-scoped API contract for currently implemented platform capabilities.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '204': { description: Session ended } }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { description: Rotated mobile session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '401': { $ref: '#/components/responses/Error' } }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      responses:
        '200': { description: Current principal, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: status, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
      responses: { '200': { description: Project page, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } } }
  /api/v1/projects/{projectID}:
    get:
      operationId: getProject
      parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
      responses:
        '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workloads:
    get:
      operationId: listWorkloads
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: Workload page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkloadPage' } } } } }
  /api/v1/workloads/{workloadID}:
    get:
      operationId: getWorkload
      parameters: [ { name: workloadID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Workload, content: { application/json: { schema: { $ref: '#/components/schemas/Workload' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/llm-calls:
    get:
      operationId: listLLMCalls
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: workload_id, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Call page, content: { application/json: { schema: { $ref: '#/components/schemas/CallPage' } } } } }
  /api/v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      parameters: [ { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { $ref: '#/components/parameters/Timezone' }, { name: project_id, in: query, schema: { type: string, format: uuid } }, { name: workload_id, in: query, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsOverview' } } } } }
  /api/v1/analytics/costs:
    get:
      operationId: getAnalyticsCosts
      parameters: [ { name: dimension, in: query, schema: { type: string, enum: [project, workload, provider, model, task] } }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { $ref: '#/components/parameters/Timezone' }, { name: project_id, in: query, schema: { type: string, format: uuid } }, { name: workload_id, in: query, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Cost analytics, content: { application/json: { schema: { $ref: '#/components/schemas/CostAnalytics' } } } } }
  /api/v1/analytics/tokens:
    get:
      operationId: getAnalyticsTokens
      responses: { '200': { description: Token analytics, content: { application/json: { schema: { $ref: '#/components/schemas/TokenSummary' } } } } }
  /api/v1/analytics/latency:
    get:
      operationId: getAnalyticsLatency
      responses: { '200': { description: Latency analytics, content: { application/json: { schema: { $ref: '#/components/schemas/LatencySummary' } } } } }
  /api/v1/analytics/errors:
    get:
      operationId: getAnalyticsErrors
      responses: { '200': { description: Error analytics, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorSummary' } } } } }
  /api/v1/recommendations:
    get:
      operationId: listRecommendations
      parameters: [ { name: status, in: query, schema: { type: string } }, { name: priority, in: query, schema: { type: string } } ]
      responses: { '200': { description: Recommendations, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } } } } }
  /api/v1/recommendations/{recommendationID}:
    get:
      operationId: getRecommendation
      parameters: [ { name: recommendationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Recommendation, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/recommendations/{recommendationID}/accept:
    post:
      operationId: acceptRecommendation
      parameters: [ { name: recommendationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationReviewRequest' } } } }
      responses:
        '200': { description: Accepted for evaluation, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/recommendations/{recommendationID}/reject:
    post:
      operationId: rejectRecommendation
      parameters: [ { name: recommendationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationReviewRequest' } } } }
      responses:
        '200': { description: Rejected recommendation, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/recommendations/{recommendationID}/audit-history:
    get:
      operationId: getRecommendationAuditHistory
      parameters: [ { name: recommendationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Audit timeline, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/evaluation-datasets:
    get:
      operationId: listEvaluationDatasets
      responses: { '200': { description: Evaluation datasets, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EvaluationDataset' } } } } } } } }
    post:
      operationId: createEvaluationDataset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEvaluationDataset' } } } }
      responses:
        '201': { description: Dataset created atomically with sanitized cases, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDataset' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/evaluation-datasets/{datasetID}:
    get:
      operationId: getEvaluationDataset
      parameters: [ { name: datasetID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Dataset cases and runs, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDataset' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/evaluation-runs:
    post:
      operationId: createEvaluationRun
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEvaluationRun' } } } }
      responses:
        '201': { description: Deterministic candidate evaluation completed, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRun' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/evaluation-runs/{runID}:
    get:
      operationId: getEvaluationRun
      parameters: [ { name: runID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Evaluation run results, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRun' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/local-model-configurations:
    get:
      operationId: listLocalModelConfigurations
      responses: { '200': { description: Local model configurations, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LocalModelConfiguration' } } } } } } } }
    post:
      operationId: createLocalModelConfiguration
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalModelConfigurationInput' } } } }
      responses:
        '201': { description: Configuration created, content: { application/json: { schema: { $ref: '#/components/schemas/LocalModelConfiguration' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/local-model-configurations/{configurationID}/compare:
    post:
      operationId: compareLocalModelEconomics
      parameters: [ { name: configurationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalModelComparisonInput' } } } }
      responses:
        '200': { description: Hosted and local economics comparison, content: { application/json: { schema: { $ref: '#/components/schemas/LocalModelComparison' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/experiments:
    get:
      operationId: listExperiments
      responses: { '200': { description: Experiments, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Experiment' } } } } } } } }
    post:
      operationId: createExperiment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExperiment' } } } }
      responses: { '201': { description: Draft experiment, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/experiments/{experimentID}:
    get:
      operationId: getExperiment
      parameters: [ { $ref: '#/components/parameters/ExperimentID' } ]
      responses: { '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/experiments/{experimentID}/approve:
    post: { operationId: approveExperiment, parameters: [ { $ref: '#/components/parameters/ExperimentID' } ], responses: { '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/experiments/{experimentID}/start:
    post: { operationId: startExperiment, parameters: [ { $ref: '#/components/parameters/ExperimentID' } ], responses: { '200': { description: Started or resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/experiments/{experimentID}/pause:
    post: { operationId: pauseExperiment, parameters: [ { $ref: '#/components/parameters/ExperimentID' } ], responses: { '200': { description: Paused, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/experiments/{experimentID}/rollback:
    post:
      operationId: rollbackExperiment
      parameters: [ { $ref: '#/components/parameters/ExperimentID' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/experiments/{experimentID}/complete:
    post:
      operationId: completeExperiment
      parameters: [ { $ref: '#/components/parameters/ExperimentID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExperimentMetrics' } } } }
      responses: { '200': { description: Completed or automatically rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/experiments/{experimentID}/verify:
    post: { operationId: verifyExperiment, parameters: [ { $ref: '#/components/parameters/ExperimentID' } ], responses: { '200': { description: Verified savings, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/experiments/{experimentID}/metrics:
    post:
      operationId: recordExperimentMetrics
      parameters: [ { $ref: '#/components/parameters/ExperimentID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExperimentMetrics' } } } }
      responses: { '200': { description: Metrics recorded or automatic rollback applied, content: { application/json: { schema: { $ref: '#/components/schemas/Experiment' } } } } }
  /api/v1/budget-thresholds:
    get: { operationId: listBudgetThresholds, responses: { '200': { description: Budget thresholds, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BudgetThreshold' } } } } } } } } }
  /api/v1/projects/{projectID}/budget-thresholds:
    post:
      operationId: setBudgetThreshold
      parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [percentage, severity], properties: { percentage: { type: string }, severity: { type: string, enum: [info, warning, critical] } } } } } }
      responses: { '201': { description: Threshold configured, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetThreshold' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/budget-alerts:
    get:
      operationId: listBudgetAlerts
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, acknowledged, resolved] } } ]
      responses: { '200': { description: Budget alerts, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BudgetAlert' } } } } } } } }
  /api/v1/budget-alerts/{alertID}/acknowledge:
    post:
      operationId: acknowledgeBudgetAlert
      parameters: [ { name: alertID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Alert acknowledged, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetAlert' } } } }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/budget-alerts/evaluate:
    post: { operationId: evaluateBudgets, responses: { '200': { description: Scheduled evaluation result, content: { application/json: { schema: { type: object, required: [created, suppressed], properties: { created: { type: integer }, suppressed: { type: integer } } } } } } } }
  /api/v1/notifications:
    get: { operationId: listNotifications, responses: { '200': { description: In-app notifications, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } } } } } }
  /api/v1/notification-preferences:
    get: { operationId: getNotificationPreferences, responses: { '200': { description: Notification preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } } } }
    put:
      operationId: updateNotificationPreferences
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses: { '200': { description: Updated notification preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } } }
components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: access_token }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0 } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    Timezone: { name: timezone, in: query, schema: { type: string } }
    ProjectID: { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
    ExperimentID: { name: experimentID, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: API error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { type: object, required: [code, message, request_id], properties: { code: { type: string }, message: { type: string }, request_id: { type: string } } } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, format: password }, client: { type: string, enum: [mobile] } }
    RefreshRequest: { type: object, properties: { refresh_token: { type: string } } }
    Session: { type: object, required: [expires_at], properties: { access_token: { type: string }, refresh_token: { type: string }, token_type: { type: string }, expires_at: { type: string, format: date-time } } }
    CurrentUser: { type: object, required: [id, organization_id, role], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, role: { type: string, enum: [owner, admin, engineer, finance, viewer] } } }
    Project:
      type: object
      required: [id, organization_id, name, slug, environment, monthly_budget, currency, status, created_at, updated_at]
      properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, name: { type: string }, slug: { type: string }, environment: { type: string }, monthly_budget: { type: string }, currency: { type: string }, status: { type: string }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    Workload:
      type: object
      required: [id, project_id, name, slug, type, owner, criticality, quality_requirement, privacy_classification, status, created_at, updated_at]
      properties: { id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, name: { type: string }, slug: { type: string }, type: { type: string }, owner: { type: string }, criticality: { type: string }, quality_requirement: { type: string }, privacy_classification: { type: string }, status: { type: string }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    LLMCall:
      type: object
      required: [id, organization_id, project_id, workload_id, external_call_id, provider, model, estimated_cost, currency, created_at, idempotent_replay]
      properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, project_id: { type: string, format: uuid }, workload_id: { type: string, format: uuid }, external_call_id: { type: string }, provider: { type: string }, model: { type: string }, estimated_cost: { type: string }, currency: { type: string }, redacted_prompt_preview: { type: string }, redacted_response_preview: { type: string }, created_at: { type: string, format: date-time }, idempotent_replay: { type: boolean } }
    ProjectPage: { type: object, required: [items, limit, offset], properties: { items: { type: array, items: { $ref: '#/components/schemas/Project' } }, limit: { type: integer }, offset: { type: integer } } }
    WorkloadPage: { type: object, required: [items, limit, offset], properties: { items: { type: array, items: { $ref: '#/components/schemas/Workload' } }, limit: { type: integer }, offset: { type: integer } } }
    CallPage: { type: object, required: [items, limit, offset], properties: { items: { type: array, items: { $ref: '#/components/schemas/LLMCall' } }, limit: { type: integer }, offset: { type: integer } } }
    AnalyticsOverview:
      type: object
      required: [observed_cost, previous_period_cost, estimated_monthly_projection, currency, call_count, input_tokens, output_tokens, cached_input_tokens, average_latency_ms, error_rate, retry_rate, projection_method]
      properties: { observed_cost: { type: string }, previous_period_cost: { type: string }, estimated_monthly_projection: { type: string }, currency: { type: string }, call_count: { type: integer }, input_tokens: { type: integer }, output_tokens: { type: integer }, cached_input_tokens: { type: integer }, average_latency_ms: { type: string }, error_rate: { type: string }, retry_rate: { type: string }, projection_method: { type: string } }
    CostPoint: { type: object, required: [key, cost, calls, currency], properties: { key: { type: string }, cost: { type: string }, calls: { type: integer }, currency: { type: string } } }
    DailyPoint: { type: object, required: [date, cost, calls], properties: { date: { type: string, format: date }, cost: { type: string }, calls: { type: integer } } }
    CostAnalytics: { type: object, required: [dimension, breakdown, daily, currency], properties: { dimension: { type: string }, breakdown: { type: array, items: { $ref: '#/components/schemas/CostPoint' } }, daily: { type: array, items: { $ref: '#/components/schemas/DailyPoint' } }, currency: { type: string } } }
    TokenSummary: { type: object, required: [input, output, cached_input], properties: { input: { type: integer }, output: { type: integer }, cached_input: { type: integer } } }
    LatencySummary: { type: object, required: [average_ms, p50_ms, p95_ms], properties: { average_ms: { type: string }, p50_ms: { type: string }, p95_ms: { type: string } } }
    ErrorSummary: { type: object, required: [calls, errors, retried_calls, error_rate, retry_rate], properties: { calls: { type: integer }, errors: { type: integer }, retried_calls: { type: integer }, error_rate: { type: string }, retry_rate: { type: string } } }
    Recommendation:
      type: object
      additionalProperties: true
      required: [id, workload_id, recommendation_type, priority, confidence_level, status, currency, quality_risk, operational_risk, required_next_action, rule_version, confidence, estimated_monthly_savings, estimated_implementation_cost, reason_codes, evidence_summary, confidence_inputs, current_execution, proposed_execution, created_at, updated_at]
